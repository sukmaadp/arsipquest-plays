<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARSIP-QUEST — AR Scanner</title>
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- A-Frame Library (1.3.0) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame (webcam tracking) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <!-- 1. CAMERA LOADING OVERLAY -->
  <div id="ar-loader" class="arjs-loader" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #0a0a09; color: #ecd69a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; font-family: var(--font-header);">
    <div style="width: 50px; height: 50px; border: 3px solid rgba(207, 168, 92, 0.1); border-top: 3px solid var(--gold-primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
    <div style="font-weight: bold; font-size: 16px; letter-spacing: 2px;">MENGHUBUNGKAN KAMERA AR...</div>
    <div style="margin-top: 8px; font-size: 11px; color: var(--text-muted); font-family: var(--font-body);">Izinkan akses kamera jika diminta browser.</div>
  </div>
  
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <!-- 2. SCANNING HELPER OVERLAY UI -->
  <div class="ar-overlay">
    <!-- Camera View Top Header -->
    <header class="ar-header">
      <button class="btn-back-circle" onclick="exitAR()" title="Kembali ke Detail">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="ar-site-info">
        <h3 id="ar-site-name">SITUS SEJARAH</h3>
        <p id="ar-site-category">KATEGORI</p>
      </div>
    </header>

    <!-- Instruction helper banner -->
    <div id="ar-helper" class="ar-helper-banner">
      <div class="ar-helper-pulse"></div>
      <span>Arahkan kamera ke <b>Hiro Marker</b> kartu</span>
    </div>
  </div>

  <!-- 3. STORY SHEET OVERLAY (SLIDE UP CARD) -->
  <div id="story-sheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">SITUS TERDETEKSI</h2>
    <div class="sheet-text">
      <p id="story-text">Memuat cerita sejarah...</p>
    </div>
    <button id="btn-start-quiz" class="btn btn-gold">
      MULAI QUIZ VALIDASI
    </button>
  </div>

  <!-- 4. QUIZ WINDOW (MODAL OVERLAY) -->
  <div id="quiz-modal" class="quiz-modal">
    <div class="quiz-container">
      <div class="card" style="margin-bottom: 0;">
        <h2 style="font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid rgba(207, 168, 92, 0.2); padding-bottom: 8px;">QUIZ VALIDASI</h2>
        <div id="quiz-question" class="quiz-question">
          Pertanyaan Soal
        </div>
        <div id="quiz-options" class="quiz-options">
          <!-- Populated dynamically via JS -->
        </div>
        <button id="btn-submit-quiz" class="btn btn-gold" disabled>
          KIRIM JAWABAN
        </button>
      </div>
    </div>
  </div>

  <!-- 5. VALIDATION RESULT VIEW -->
  <div id="result-screen" class="result-screen hidden">
    <div class="result-glow"></div>
    <div class="result-icon-container">
      <!-- Checked Icon for Success / Warn Icon for Fail populated by JS -->
      <span id="result-icon" style="font-size: 36px; line-height: 1;">✓</span>
    </div>
    <h1 id="result-title" class="result-title">VALIDASI BERHASIL</h1>
    <p id="result-message" class="result-message">
      Kamu dapat mengklaim situs ini pada board game fisik.
    </p>
    <button onclick="exitAR()" class="btn btn-outline" style="max-width: 250px;">
      KEMBALI KE PORTAL
    </button>
  </div>

  <!-- 6. A-FRAME WEBAR VIEWPORT -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
    
    <!-- Environment Ambient Lighting -->
    <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-1 2 1"></a-entity>

    <!-- AR Preset Hiro Marker -->
    <a-marker preset="hiro" id="hiro-marker" marker-listener>
      
      <!-- Container for models layout scale adjustment -->
      <a-entity id="diorama-root" position="0 0 0" scale="0.8 0.8 0.8" rotation="0 0 0">
        
        <!-- Base Pedestal (Stays uniform for all sites projection) -->
        <a-cylinder position="0 -0.05 0" radius="0.8" height="0.1" color="#4a3e2c" material="roughness: 0.85; metalness: 0.15"></a-cylinder>
        <a-cylinder position="0 -0.01 0" radius="0.75" height="0.02" color="#2c3a2f" material="roughness: 0.9"></a-cylinder> <!-- Turf Top -->

        <!-- Dynamic GLB Model Container -->
        <a-gltf-model id="glb-model" src="" position="0 0.05 0" scale="1 1 1" rotation="0 0 0" visible="false"></a-gltf-model>

      </a-entity>
    </a-marker>

    <!-- Camera viewport entity -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/ar-app.js"></script>
</body>
</html>
