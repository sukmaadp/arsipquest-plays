<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARSIP-QUEST — Liang Bua</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden; background: #0a0a09;">

  <!-- Tombol Langsung ke Kuis -->
  <button onclick="window.location.href='quiz.html?id=liang_bua'" 
    style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999; padding: 14px 28px; background: linear-gradient(135deg, #8b6e35, #cfa85c, #ecd69a); color: #12120f; font-weight: bold; border: 1px solid #ecd69a; border-radius: 12px; cursor: pointer; font-family: sans-serif; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-transform: uppercase;">
    LANJUT KE KUIS →
  </button>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; exposure: 1.2;" vr-mode-ui="enabled: false;">

    <!-- Pencahayaan Terang agar Tekstur dan Detail Model 3D Kelihatan Jelas -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.6;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 2 2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8;" position="-1 1 2"></a-entity>

    <a-assets>
      <a-asset-item id="model" src="assets/models/liang_bua.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" id="m">
      <!-- Model menghadap ke depan ke arah kamera (rotation -90 0 0) -->
      <a-gltf-model 
        src="#model" 
        scale="0.6 0.6 0.6" 
        rotation="-90 0 0"
        position="0 0 0">
      </a-gltf-model>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.querySelector("#m").addEventListener("markerFound", () => {
      setTimeout(() => {
        window.location.href = "quiz.html?id=liang_bua";
      }, 10000);
    });
  </script>
</body>
</html>
