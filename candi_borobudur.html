<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>ARSIP-QUEST — Candi Borobudur</title>

  <!-- A-Frame 1.3.0 & AR.js resmi (Stabil & Kamera Lancar Tanpa Layar Hitam) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0px;
      overflow: hidden;
    }

    /* Tombol Langsung ke Kuis */
    .btn-ar-quiz {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b6e35, #cfa85c, #ecd69a);
      color: #12120f;
      font-weight: bold;
      border: 1px solid #ecd69a;
      border-radius: 12px;
      cursor: pointer;
      font-family: sans-serif;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Tombol Langsung ke Kuis -->
  <button class="btn-ar-quiz" onclick="window.location.href='quiz.html?id=candi_borobudur'">
    LANJUT KE KUIS →
  </button>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Pencahayaan Terang agar Tekstur dan Detail Model 3D Kelihatan Jelas -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 2 2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8;" position="-1 1 2"></a-entity>

    <!-- Asset Preloader Resmi A-Frame -->
    <a-assets>
      <a-asset-item id="model" src="assets/models/candi_borobudur.glb"></a-asset-item>
    </a-assets>

    <!-- Marker Hiro Resmi AR.js: Model 3D langsung muncul seketika saat kartu terlihat -->
    <a-marker preset="hiro" id="m">
      <a-gltf-model 
        id="model-3d"
        src="#model" 
        scale="0.6 0.6 0.6" 
        rotation="-90 0 0" 
        position="0 0 0">
      </a-gltf-model>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Deteksi marker Hiro -> redirect otomatis ke kuis setelah 10 detik
    const marker = document.getElementById('m');
    if (marker) {
      marker.addEventListener('markerFound', () => {
        setTimeout(() => {
          window.location.href = "quiz.html?id=candi_borobudur";
        }, 10000);
      });
    }

    window.addEventListener('camera-error', () => {
      alert('Tidak dapat mengakses kamera. Pastikan Anda mengizinkan akses kamera di browser!');
    });
  </script>
</body>
</html>
