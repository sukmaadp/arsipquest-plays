<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>ARSIP-QUEST — Situs Sangiran</title>

  <!-- A-Frame 1.3.0 & AR.js resmi (Stabil & Bebas Black Screen) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0px;
      overflow: hidden;
    }

    /* Tombol Langsung ke Kuis */
    .btn-ar-quiz {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b6e35, #cfa85c, #ecd69a);
      color: #12120f;
      font-weight: bold;
      border: 1px solid #ecd69a;
      border-radius: 12px;
      cursor: pointer;
      font-family: sans-serif;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Status HUD Info Pengguna */
    #status-hud {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(18, 18, 15, 0.88);
      color: #ecd69a;
      border: 1px solid #cfa85c;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      transition: opacity 0.5s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Status HUD Real-time -->
  <div id="status-hud">📷 Membuka kamera...</div>

  <!-- Tombol Langsung ke Kuis -->
  <button class="btn-ar-quiz" onclick="window.location.href='quiz.html?id=situs_sangiran'">
    LANJUT KE KUIS →
  </button>

  <a-scene embedded vr-mode-ui="enabled: false;" loading-screen="enabled: false;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <!-- Pencahayaan Terang agar Tekstur dan Detail Model 3D Kelihatan Jelas -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.6;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 2 2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8;" position="-1 1 2"></a-entity>

    <a-marker preset="hiro" id="m">
      <!-- Model 3D langsung dimuat di marker TANPA <a-assets> agar kamera langsung aktif seketika -->
      <a-gltf-model 
        id="model-3d"
        src="assets/models/situs_sangiran.glb" 
        scale="0.6 0.6 0.6" 
        rotation="-90 0 0"
        position="0 0 0">
      </a-gltf-model>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const hud = document.getElementById('status-hud');
    const model = document.getElementById('model-3d');
    const marker = document.getElementById('m');

    // Cek status kamera aktif
    function updateCameraStatus() {
      const video = document.querySelector('video#arjs-video') || document.querySelector('video');
      if (video && video.readyState >= 2) {
        if (hud && hud.innerText.includes('Membuka kamera')) {
          hud.innerText = '⏳ Kamera aktif! Mengunduh model 3D...';
        }
      }
    }
    window.addEventListener('arjs-video-loaded', updateCameraStatus);
    const checkVideo = setInterval(() => {
      updateCameraStatus();
      const video = document.querySelector('video#arjs-video') || document.querySelector('video');
      if (video && video.readyState >= 2) clearInterval(checkVideo);
    }, 500);

    // Ketika file model 3D selesai terunduh
    if (model) {
      model.addEventListener('model-loaded', () => {
        if (hud) {
          hud.innerText = '✨ Siap! Arahkan kamera ke kartu marker';
          setTimeout(() => {
            hud.style.opacity = '0';
          }, 3000);
        }
      });
    }

    // Deteksi marker Hiro -> redirect otomatis setelah 10 detik
    if (marker) {
      marker.addEventListener('markerFound', () => {
        if (hud) {
          hud.style.opacity = '1';
          hud.innerText = '🎯 Marker terdeteksi! Menuju kuis...';
        }
        setTimeout(() => {
          window.location.href = "quiz.html?id=situs_sangiran";
        }, 10000);
      });
    }

    window.addEventListener('camera-error', () => {
      if (hud) hud.innerText = '⚠️ Akses kamera ditolak';
      alert('Tidak dapat mengakses kamera. Pastikan Anda mengizinkan akses kamera di browser!');
    });
  </script>
</body>
</html>
