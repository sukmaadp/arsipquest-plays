<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARSIP-QUEST — Kota Lama Semarang</title>

  <!-- A-Frame 1.3.0 (Versi resmi paling stabil untuk WebAR AR.js) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* Pastikan background transparan agar video kamera tidak tertutup warna hitam */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }

    /* Pastikan video feed webcam tampil penuh di layar */
    video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: -2 !important;
    }

    .btn-ar-quiz {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b6e35, #cfa85c, #ecd69a);
      color: #12120f;
      font-weight: bold;
      border: 1px solid #ecd69a;
      border-radius: 12px;
      cursor: pointer;
      font-family: sans-serif;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Tombol Langsung ke Kuis -->
  <button class="btn-ar-quiz" onclick="window.location.href='quiz.html?id=kota_lama_semarang'">
    LANJUT KE KUIS →
  </button>

  <a-scene embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
    renderer="logarithmicDepthBuffer: true; colorManagement: true;" 
    vr-mode-ui="enabled: false;">

    <!-- Pencahayaan Terang agar Tekstur dan Detail Model 3D Kelihatan Jelas -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.6;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 2 2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8;" position="-1 1 2"></a-entity>

    <!-- Model 3D langsung dimuat di marker TANPA <a-assets> agar kamera langsung aktif seketika -->
    <a-marker preset="hiro" id="m">
      <a-gltf-model 
        src="assets/models/kota_lama_semarang.glb" 
        scale="0.6 0.6 0.6" 
        rotation="-90 0 0"
        position="0 0 0">
      </a-gltf-model>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.querySelector("#m").addEventListener("markerFound", () => {
      setTimeout(() => {
        window.location.href = "quiz.html?id=kota_lama_semarang";
      }, 10000);
    });

    window.addEventListener('camera-error', (err) => {
      alert("Tidak dapat mengakses kamera. Pastikan Anda mengizinkan izin kamera di browser!");
    });
  </script>
</body>
</html>
