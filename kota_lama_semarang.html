<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>ARSIP-QUEST — Kota Lama Semarang</title>

  <!-- A-Frame 1.4.0 & AR.js resmi untuk WebAR -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* 1. Pastikan html & body transparan dan memenuhi seluruh layar */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: transparent !important;
      background-color: transparent !important;
    }

    /* 2. KUNCI FULLSCREEN: Paksa A-Frame Scene dan Canvas memenuhi 100vw x 100vh tanpa celah putih */
    a-scene, .a-canvas {
      width: 100vw !important;
      height: 100vh !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
    }

    /* 3. Posisi video feed kamera webcam agar pas di latar belakang */
    video#arjs-video, video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: -2 !important;
    }

    /* Tombol Langsung ke Kuis */
    .btn-ar-quiz {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b6e35, #cfa85c, #ecd69a);
      color: #12120f;
      font-weight: bold;
      border: 1px solid #ecd69a;
      border-radius: 12px;
      cursor: pointer;
      font-family: sans-serif;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Status HUD pemberitahuan progres loading ke user */
    #hud-status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      padding: 10px 22px;
      background: rgba(18, 18, 15, 0.88);
      color: #ecd69a;
      border: 1px solid #cfa85c;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Status HUD untuk info ke user -->
  <div id="hud-status">⏳ Memuat Kamera & Model 3D...</div>

  <!-- Tombol Langsung ke Kuis -->
  <button class="btn-ar-quiz" onclick="window.location.href='quiz.html?id=kota_lama_semarang'">
    LANJUT KE KUIS →
  </button>

  <a-scene embedded style="width: 100vw; height: 100vh;"
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    renderer="colorManagement: true; exposure: 1.2;" 
    vr-mode-ui="enabled: false;">

    <!-- Pencahayaan Terang agar Tekstur dan Detail Model 3D Kelihatan Jelas -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 2 2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8;" position="-1 1 2"></a-entity>

    <a-assets>
      <a-asset-item id="model" src="assets/models/kota_lama_semarang.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" id="m">
      <!-- Model 3D menghadap ke depan ke arah kamera (rotation -90 0 0) -->
      <a-gltf-model 
        id="model-3d"
        src="#model" 
        scale="0.6 0.6 0.6" 
        rotation="-90 0 0"
        position="0 0 0">
      </a-gltf-model>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const hud = document.getElementById('hud-status');
    const marker = document.getElementById('m');
    const scene = document.querySelector('a-scene');

    // Trigger window resize agar AR.js menghitung ulang ukuran kamera secara penuh tanpa celah putih
    function forceResize() {
      window.dispatchEvent(new Event('resize'));
    }
    window.addEventListener('load', () => {
      setTimeout(forceResize, 300);
      setTimeout(forceResize, 1000);
    });

    // Ketika scene & file GLB selesai dimuat
    function onReady() {
      if (hud) {
        hud.innerText = '✅ Siap! Arahkan kamera ke kartu situs';
        setTimeout(() => {
          hud.style.opacity = '0';
        }, 3500);
      }
    }

    if (scene) {
      if (scene.hasLoaded) {
        onReady();
      } else {
        scene.addEventListener('loaded', onReady);
      }
    }

    // Deteksi marker Hiro
    if (marker) {
      marker.addEventListener('markerFound', () => {
        if (hud) {
          hud.style.opacity = '1';
          hud.innerText = '✨ Terdeteksi! Menuju kuis...';
        }
        setTimeout(() => {
          window.location.href = "quiz.html?id=kota_lama_semarang";
        }, 10000);
      });
    }

    window.addEventListener('camera-error', (err) => {
      if (hud) hud.innerText = '⚠️ Akses kamera ditolak';
      alert("Tidak dapat mengakses kamera. Pastikan Anda mengizinkan izin kamera di browser!");
    });
  </script>
</body>
</html>
