<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>ARSIP-QUEST — Lawang Sewu</title>

  <!-- A-Frame 1.3.0 & AR.js resmi (Stabil & Kamera Lancar) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0px;
      overflow: hidden;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Loading Overlay Elegan saat Menyiapkan 3D Model */
    #loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0c0c0b;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ecd69a;
      font-family: sans-serif;
      text-align: center;
      padding: 24px;
      transition: opacity 0.5s ease;
      box-sizing: border-box;
    }

    /* Tombol Langsung ke Kuis */
    .btn-ar-quiz {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 14px 28px;
      background: linear-gradient(135deg, #8b6e35, #cfa85c, #ecd69a);
      color: #12120f;
      font-weight: bold;
      border: 1px solid #ecd69a;
      border-radius: 12px;
      cursor: pointer;
      font-family: sans-serif;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Layar Loading Elegan -->
  <div id="loader-overlay">
    <div style="width: 48px; height: 48px; border: 4px solid rgba(207,168,92,0.2); border-top: 4px solid #cfa85c; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
    <div style="font-size: 11px; letter-spacing: 2px; color: #cfa85c; text-transform: uppercase; margin-bottom: 8px;">ARSIP-QUEST WebAR</div>
    <h2 style="font-size: 20px; margin: 0 0 8px; color: #fff; font-weight: 700;">Lawang Sewu</h2>
    <p style="font-size: 13px; color: #aaa; margin: 0; max-width: 300px; line-height: 1.5;">Sedang menyiapkan diorama 3D & kamera...<br><span style="font-size: 11px; color: #888;">Arahkan kamera ke kartu Hiro Marker saat kamera aktif.</span></p>
  </div>

  <!-- Tombol Langsung ke Kuis -->
  <button class="btn-ar-quiz" onclick="window.location.href='quiz.html?id=lawang_sewu'">
    LANJUT KE KUIS →
  </button>

  <a-scene embedded vr-mode-ui="enabled: false;"
    renderer="colorManagement: true; exposure: 1.2;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Pencahayaan Terang agar Tekstur dan Detail Model 3D Kelihatan Jelas -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 2 2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8;" position="-1 1 2"></a-entity>

    <!-- Asset Preloader Resmi A-Frame -->
    <a-assets timeout="30000">
      <a-asset-item id="model" src="assets/models/lawang_sewu.glb"></a-asset-item>
    </a-assets>

    <!-- Marker Hiro Resmi AR.js: Model 3D langsung muncul seketika saat marker terlihat -->
    <a-marker preset="hiro" id="m">
      <a-gltf-model 
        id="model-3d"
        src="#model" 
        scale="0.6 0.6 0.6" 
        rotation="-90 0 0"
        position="0 0 0">
      </a-gltf-model>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const loader = document.getElementById('loader-overlay');
    const marker = document.getElementById('m');

    function hideLoader() {
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    }

    // Hilangkan loading screen saat scene dan asset 3D siap
    if (scene) {
      if (scene.hasLoaded) {
        hideLoader();
      } else {
        scene.addEventListener('loaded', hideLoader);
      }
    }
    // Fallback pengaman agar loading screen selalu hilang setelah beberapa detik
    setTimeout(hideLoader, 6000);

    // Deteksi marker Hiro -> redirect otomatis setelah 10 detik
    if (marker) {
      marker.addEventListener('markerFound', () => {
        setTimeout(() => {
          window.location.href = "quiz.html?id=lawang_sewu";
        }, 10000);
      });
    }

    window.addEventListener('camera-error', () => {
      alert('Tidak dapat mengakses kamera. Pastikan Anda mengizinkan akses kamera di browser!');
    });
  </script>
</body>
</html>
